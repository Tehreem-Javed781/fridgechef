# Part I - containerized deployment on EC2
# Start:  docker compose up -d        Stop:  docker compose down
name: fridgechef

services:
  db:
    image: mysql:8.0
    container_name: fridgechef-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: fridgechef
      MYSQL_USER: fridgechef
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"            # host 3307 -> container 3306
    volumes:
      - fridgechef-db-data:/var/lib/mysql   # keeps data when containers are removed
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: tehreemtj/fridgechef:v1      # the image pushed to Docker Hub
    container_name: fridgechef-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db                # service name of the database container
      DB_PORT: "3306"
      DB_NAME: fridgechef
      DB_USER: fridgechef
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "80:8000"              # host 80 -> container 8000

volumes:
  fridgechef-db-data:
