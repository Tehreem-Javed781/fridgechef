{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block guest %}
<div class="authbox">
  <h1>Welcome back</h1>
  <p class="sub">Log in to see what you can cook today.</p>
  <form method="post" class="form" id="login-form">
    <label>Email<input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="email"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-ink btn-block" type="submit">Log in</button>
  </form>
  <p class="sub">New to FridgeChef? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
