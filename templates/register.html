{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block guest %}
<div class="authbox">
  <h1>Create your account</h1>
  <p class="sub">You'll be adding ingredients in under a minute.</p>
  <form method="post" class="form" id="register-form">
    <label>Full name<input name="name" value="{{ name or '' }}" required minlength="2" autocomplete="name"></label>
    <label>Email<input type="email" name="email" value="{{ email or '' }}" required autocomplete="email"></label>
    <div class="cols-2">
      <label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
      <label>Confirm password<input type="password" name="confirm" required minlength="6" autocomplete="new-password"></label>
    </div>
    <button class="btn btn-ink btn-block" type="submit">Create account</button>
  </form>
  <p class="sub">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
